name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: bnhyocinlvdfpbhybtaw

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: [trigger-ingest, notify-discord]
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ${{ matrix.function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ${{ matrix.function }} --project-ref $SUPABASE_PROJECT_REF
