name: CardTrack email ingest

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: 'email_accounts.id (which Gmail to scrape)'
        required: true
        type: string
      site_id:
        description: 'sites.id (which sender to filter on)'
        required: true
        type: string

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cardtrack
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run ingest
        run: node ingest.js --account="${{ inputs.account_id }}" --site="${{ inputs.site_id }}"
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
